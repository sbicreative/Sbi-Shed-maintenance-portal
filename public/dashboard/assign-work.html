<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assign Work - SBI Shed</title>

    <link rel="stylesheet"
          href="../css/assign-work.css?v=20260820-2">

    <link rel="stylesheet" href="../css/maintenance-theme.css?v=20260804-8">

</head>

<body class="assign-work-page">

<div class="dashboard">

    <!-- HEADER -->

    <div class="page-header">

        <div>

            <h1>ASSIGN WORK</h1>

            <p>SBI Shed Loco Maintenance Management System</p>

        </div>

        <a href="incharge.html"
           class="back-btn">

            Dashboard

        </a>

    </div>


    <!-- TOP FILTER -->

    <div class="filter-card">

        <div class="filter-box">

            <label>Date</label>

            <input
                type="date"
                id="assignDate"
            >

        </div>


        <div class="filter-box">

            <label>Type of Loco</label>

            <select id="locoType">

                <option value="">
                    Select Type of Loco
                </option>

                <option value="MG">MG</option>

                <option value="Alco">Alco</option>

                <option value="HHP">HHP</option>

                <option value="WAG9">WAG9</option>

                <option value="WAP7">WAP7</option>

                <option value="WAG12">WAG12</option>

                <option value="External">Other Shed Loco</option>

            </select>

        </div>

    </div>


    <!-- ASSIGN WORK TABLE -->

    <div class="work-card">

        <div class="table-title">

            <h2>Work Assignment</h2>

            <button
                type="button"
                id="addLocoBtn"
                class="add-loco-btn">

                + Add Loco

            </button>

        </div>


        <div class="table-container">

            <table class="mobile-assign-work-table"
                   data-mobile-layout="single">

                <thead>

                    <tr>

                        <th>S.No.</th>

                        <th>Loco No.</th>

                        <th>Schedule</th>

                        <th>Assign Work</th>
                        <th>Supervisor</th>

                        <th>Remarks</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="workTableBody">
                    <tr class="empty-work-row" aria-label="No loco selected">
                        <td data-mobile-label="S.No."><span class="empty-work-box"></span></td>
                        <td data-mobile-label="Loco No."><span class="empty-work-box"></span></td>
                        <td data-mobile-label="Schedule"><span class="empty-work-box"></span></td>
                        <td data-mobile-label="Assign Work"><span class="empty-work-box"></span></td>
                        <td data-mobile-label="Supervisor"><span class="empty-work-box"></span></td>
                        <td data-mobile-label="Remarks"><span class="empty-work-box"></span></td>
                        <td data-mobile-label="Action"><span class="empty-work-box"></span></td>
                    </tr>
                </tbody>

            </table>

        </div>


        <div class="button-area">

            <button
                type="button"
                class="btn-reset">

                Reset

            </button>


            <button
                type="button"
                class="btn-save">

                Assign Work

            </button>

        </div>

    </div>

</div>


<script src="../js/assign-work.js?v=20260820-2"></script>

<script src="/js/pwa.js?v=20260814-2"></script>

</body>

</html>
