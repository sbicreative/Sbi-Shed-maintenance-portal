<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Incharge Dashboard</title>

    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/incharge.css?v=20260814-1">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../css/maintenance-theme.css?v=20260804-8">

</head>

<body data-dashboard-role="incharge">

    <!-- ================= HEADER ================= -->

    <header class="main-header">

        <div class="logo-left">
            <img src="../images/IR-logo.jpeg" alt="IR Logo">
        </div>

        <div class="header-title">

            <h1>SBI SHED LOCO MAINTENANCE MANAGEMENT SYSTEM</h1>

            <h2>LOCOMOTIVE SHED, SABARMATI</h2>

            <p>Western Railway</p>

        </div>

        <div class="logo-right">
            <img src="../images/SBI-logo.jpeg" alt="SBI Shed Logo">
        </div>

    </header>


    <!-- ================= TOP NAVIGATION ================= -->

    <nav class="top-nav">

        <div class="nav-details">

            Welcome,

            <span id="userName">Incharge</span>

        </div>

        <div class="nav-controls">

            <span id="currentDateTime"></span>

            <div class="nav-actions">
                <button type="button" class="portal-btn"
                        onclick="window.location.href='/dashboard/repairs-schedule.html'">
                    Repairs Schedule
                </button>
                <button type="button" class="portal-btn"
                        onclick="window.location.href='/'">
                    Main Portal
                </button>

                <button id="logoutBtn" class="logout-btn">
                    Logout
                </button>
            </div>

        </div>

    </nav>


    <!-- ================= DASHBOARD ================= -->

    <div class="dashboard">


        <!-- ================= QUICK ACTION ================= -->

        <section class="quick-actions">

            <h2>Quick Actions</h2>

            <div class="button-grid">

                <button
                    class="assign-btn"
                    onclick="location.href='assign-work.html'">

                    🚂 Assign Work

                </button>

                <button
                    class="review-btn"
                    onclick="location.href='review-work.html'">

                    📋 Assigned Work Review

                </button>

                <button
                    class="schedule-btn"
                    onclick="location.href='schedule-review.html'">

                    📝 Schedule Form Review

                </button>

                <button
                    class="viewer-btn"
                    onclick="location.href='viewer.html'">

                    👁 Viewer

                </button>

            </div>

        </section>


        <!-- ================= TODAY'S ACTIVITY ================= -->

        <section class="activity">

            <h2>Today's Activity</h2>

            <table>

                <thead>

                    <tr>

                        <th>Loco No</th>

                        <th>Schedule</th>

                        <th>Work</th>

                        <th>Supervisor</th>

                    </tr>

                </thead>

                <tbody id="activityTable">

                    <tr>

                        <td colspan="4">

                            No Record Found

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

        <section class="charge-handover-card" aria-labelledby="chargeHandoverTitle">
            <div class="charge-handover-heading">
                <div>
                    <p>Temporary authority</p>
                    <h2 id="chargeHandoverTitle">Charge Handover</h2>
                </div>
                <span id="chargeStatusBadge">Permanent Incharge</span>
            </div>
            <p id="actingChargeNotice" class="acting-charge-notice" hidden></p>
            <form id="chargeHandoverForm">
                <div class="charge-form-grid">
                    <label>
                        Acting Incharge
                        <select id="actingInchargeSelect" required>
                            <option value="">Select Supervisor</option>
                        </select>
                    </label>
                    <label>
                        From Date
                        <input id="chargeStartDate" type="date" required>
                    </label>
                    <label>
                        To Date
                        <input id="chargeEndDate" type="date" required>
                    </label>
                    <label>
                        Reason
                        <input id="chargeReason" type="text"
                               placeholder="Leave / Training / Duty">
                    </label>
                </div>
                <p id="chargeHandoverMessage" class="charge-handover-message" hidden></p>
                <button id="saveChargeHandoverBtn" type="submit">
                    Hand Over Charge
                </button>
            </form>
        </section>

    </div>

    <script src="../js/incharge.js?v=20260910-1"></script>
    <script src="../js/charge-handover.js"></script>
    <script src="/js/pwa.js?v=20260814-2"></script>

</body>

</html>
