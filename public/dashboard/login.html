<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SBI SHED Login</title>

    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet" href="../css/maintenance-theme.css?v=20260804-8">

</head>

<body>

    <!-- ===== Header ===== -->

    <header class="header">

        <div class="logo-left">
            <img src="../images/IR-logo.jpeg" alt="IR Logo">
        </div>

        <div class="title">

            <h1>SBI SHED LOCO MAINTENANCE MANAGEMENT SYSTEM</h1>

            <h3>Diesel Loco Shed, Sabarmati | Western Railway</h3>

        </div>

        <div class="logo-right">
            <img src="../images/SBI-logo.jpeg" alt="SBI Logo">
        </div>

    </header>

    <!-- ===== Login Card ===== -->

    <div class="container">

        <div class="login-card">

            <h2>User Login</h2>

            <form id="loginForm">

                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter Name"
                    required>

                <label>Mobile No (CUG)</label>

                <input
                    type="text"
                    id="mobile"
                    maxlength="10"
                    placeholder="Enter Mobile Number"
                    required>

                <button type="submit">

                    LOGIN

                </button>

            </form>

            <br>

            <a href="register.html">

                New User? Register Here

            </a>

            <br><br>

            <a href="admin-login.html">

                Admin Login

            </a>

        </div>

    </div>

<script src="../js/login.js"></script>
<script src="/js/pwa.js"></script>

<script src="/js/pwa.js"></script>
</body>

</html>
