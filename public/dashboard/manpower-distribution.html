<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Man Power Distribution - SBI Shed</title>

    <!-- Same CSS as Assign Work -->

    <link rel="stylesheet"
          href="../css/assign-work.css">

    <link rel="stylesheet"
          href="../css/manpower-distribution.css?v=20260813-2">

    <link rel="stylesheet" href="../css/maintenance-theme.css?v=20260804-18">

</head>

<body class="manpower-page">

<div class="dashboard">

    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <div>

            <h1>MAN POWER DISTRIBUTION</h1>

            <p>SBI Shed Loco Maintenance Management System</p>

        </div>

        <a href="supervisor.html"
           class="back-btn">

            Dashboard

        </a>

    </div>

    <!-- ================= FILTER ================= -->

    <div class="manpower-overview-row">
    <div class="filter-card">

        <div class="filter-box">

            <label>Date</label>

            <input
                type="date"
                id="distributionDate">

        </div>


        <div class="filter-box">

            <label>Type of Loco</label>

            <select id="locoType">

                <option value="">
                    Select Type of Loco
                </option>

                <option value="MG">MG</option>

                <option value="Alco">Alco</option>

                <option value="HHP">HHP</option>

                <option value="WAG9">WAG9</option>

                <option value="WAP7">WAP7</option>

                <option value="WAG12">WAG12</option>

            </select>

        </div>

    </div>

    <section class="staff-loan-card" aria-labelledby="staffLoanTitle">
        <div class="staff-loan-header">
            <div>
                <p class="staff-loan-kicker">Selected date</p>
                <h2 id="staffLoanTitle">Temporary Staff Loan</h2>
            </div>
            <button id="addStaffLoanBtn" type="button" class="btn-add-loan">
                + Add Temporary Staff Loan
            </button>
        </div>

        <div class="staff-loan-tabs" role="tablist" aria-label="Temporary staff loans">
            <button class="staff-loan-tab active" type="button" role="tab"
                    aria-selected="true" data-loan-tab="in">
                Loaned In <span id="loanedInCount">0</span>
            </button>
            <button class="staff-loan-tab" type="button" role="tab"
                    aria-selected="false" data-loan-tab="out">
                Loaned Out <span id="loanedOutCount">0</span>
            </button>
        </div>

        <div id="loanedInPanel" class="staff-loan-panel" role="tabpanel">
            <div id="loanedInList" class="staff-loan-list"></div>
        </div>
        <div id="loanedOutPanel" class="staff-loan-panel" role="tabpanel" hidden>
            <div id="loanedOutList" class="staff-loan-list"></div>
        </div>
    </section>
    </div>


    <!-- ================= ASSIGNED WORK TABLE ================= -->

    <div class="work-card">

        <div class="table-title">

            <h2>Assigned Work</h2>

        </div>


        <div class="table-container">

            <table data-mobile-layout="manpower">

                <thead>

                    <tr>

                        <th>S.No.</th>

                        <th>Loco No.</th>

                        <th>Schedule</th>

                        <th>Assigned Work</th>

                        <th>Man Power Distribution</th>

                        <th>Remarks</th>

                        <th>Assigned By</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="distributionTableBody">

                    <!-- JS will load rows here -->

                </tbody>

            </table>

        </div>


        <!-- ================= BUTTON AREA ================= -->

        <div class="button-area">

            <button
                id="saveDistributionBtn"
                type="button"
                class="btn-save">

                Save Distribution

            </button>

        </div>

    </div>

</div>

<div id="staffLoanModal" class="staff-loan-modal" hidden>
    <div class="staff-loan-dialog" role="dialog" aria-modal="true"
         aria-labelledby="staffLoanDialogTitle">
        <div class="staff-loan-dialog-header">
            <div>
                <p class="staff-loan-kicker">One-day transfer</p>
                <h2 id="staffLoanDialogTitle">Add Temporary Staff Loan</h2>
            </div>
            <button id="closeStaffLoanBtn" type="button" class="loan-close-btn"
                    aria-label="Close">&times;</button>
        </div>
        <form id="staffLoanForm">
            <p class="loan-date-note">Loan date: <strong id="staffLoanDate"></strong></p>
            <label for="loanStaffSelect">Staff Name</label>
            <select id="loanStaffSelect" required></select>
            <label for="loanToSectionSelect">Loan To Section</label>
            <select id="loanToSectionSelect" required></select>
            <p id="staffLoanMessage" class="staff-loan-message" hidden></p>
            <div class="staff-loan-form-actions">
                <button id="cancelStaffLoanBtn" type="button" class="loan-cancel-btn">Cancel</button>
                <button type="submit" class="btn-add-loan">Save Loan</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/manpower-distribution.js?v=20260813-2"></script>

<script src="/js/pwa.js"></script>

</body>

</html>
