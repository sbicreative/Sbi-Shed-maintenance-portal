<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SBI Shed - Employee Registration</title>

    <link rel="stylesheet" href="../css/register.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>SBI SHED LOCO MANAGEMENT SYSTEM</h1>

            <h2>Employee Registration</h2>

            <form id="registerForm">

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label>Mobile No (CUG)</label>
                    <input type="text" id="mobile" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label>PF No</label>
                    <input type="text" id="pf_no" required>
                </div>

                <div class="form-group">
                    <label>Department</label>

                    <select id="department" required>

                       <option value="">Loading...</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Section</label>

                    <select id="section" required>

                        <option value="">Select Department First</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Designation</label>

                    <select id="designation" required>

                        <option value="">Select Department First</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Role</label>

                    <select id="role" required>

                        <option value="">Select Role</option>

                        <option>Incharge</option>

                        <option>Supervisor</option>

                        <option>Staff</option>

                        <option>Viewer</option>

                        <option>Admin</option>

                        <option>Officer</option>

                    </select>

                </div>

                <button type="submit">

                    Register

                </button>

            </form>

            <p>

                Already Registered?

                <a href="login.html">

                    Login Here

                </a>

            </p>

        </div>

    </div>

    <script src="../js/register.js"></script>

<script src="/js/pwa.js"></script>
</body>

</html>
