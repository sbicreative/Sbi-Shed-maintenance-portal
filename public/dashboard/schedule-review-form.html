<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Schedule Form</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/schedule-form.css">
    <link rel="stylesheet" href="../css/maintenance-theme.css?v=20260804-8">
</head>
<body>
    <header class="main-header">
        <div class="logo-left">
            <img src="../images/ir-logo.jpeg" alt="Indian Railways logo">
        </div>
        <div class="header-title">
            <h1>SBI SHED LOCO MAINTENANCE MANAGEMENT SYSTEM</h1>
            <h2>LOCOMOTIVE SHED, SABARMATI</h2>
            <p>Western Railway</p>
        </div>
        <div class="logo-right">
            <img src="../images/sbi-logo.jpeg" alt="SBI Shed logo">
        </div>
    </header>

    <nav class="page-bar">
        <div>
            <strong id="reviewRoleTitle">Schedule Form Review</strong>
            <span id="formStatus" class="status-pill">Loading</span>
        </div>
        <div class="page-actions">
            <span id="reviewerName"></span>
            <button id="backBtn" type="button">Review Queue</button>
        </div>
    </nav>

    <main class="form-page">
        <div id="formMessage" class="message" hidden></div>

        <section class="assignment-card">
            <div><span>Staff</span><strong id="staffName">-</strong></div>
            <div><span>Loco No.</span><strong id="locoNo">-</strong></div>
            <div><span>Schedule</span><strong id="scheduleName">-</strong></div>
            <div><span>Assigned Work</span><strong id="workName">-</strong></div>
        </section>

        <section class="form-card">
            <div class="form-heading">
                <div>
                    <h2 id="formTitle">Schedule Form</h2>
                    <p id="sourceFile"></p>
                </div>
                <span id="completionText"></span>
            </div>

            <div id="templateContainer" class="document-template">
                Loading submitted form...
            </div>

            <label class="remarks-field">
                Review Remarks
                <textarea id="reviewRemarks" rows="3"
                    placeholder="Remarks are mandatory when returning a form"></textarea>
            </label>

            <label id="inchargeField" class="reviewer-field" hidden>
                Forward To Incharge
                <select id="inchargeSelect">
                    <option value="">Select Incharge</option>
                </select>
            </label>

            <div id="reviewActions" class="submit-row"></div>
        </section>
    </main>

    <script src="../js/bilingual-schedule-activities.js?v=20260814-1"></script>
    <script src="../js/schedule-review-form.js?v=20260814-1"></script>
    <script src="/js/pwa.js"></script>
</body>
</html>
