<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/staff.css">
    <link rel="stylesheet" href="../css/maintenance-theme.css?v=20260804-8">
</head>
<body class="staff-dashboard-page" data-dashboard-role="staff">
    <header class="main-header">
        <div class="logo-left">
            <img src="../images/IR-logo.jpeg" alt="Indian Railways logo">
        </div>
        <div class="header-title">
            <h1>SBI SHED LOCO MAINTENANCE MANAGEMENT SYSTEM</h1>
            <h2>LOCOMOTIVE SHED, SABARMATI</h2>
            <p>Western Railway</p>
        </div>
        <div class="logo-right">
            <img src="../images/SBI-logo.jpeg" alt="SBI Shed logo">
        </div>
    </header>

    <nav class="top-nav" aria-label="Staff dashboard navigation">
        <div class="welcome">
            Welcome, <span id="userName">Staff</span>
        </div>
        <div class="nav-actions">
            <span id="currentDateTime"></span>
            <button id="logoutBtn" class="logout-btn" type="button">
                Logout
            </button>
        </div>
    </nav>

    <main class="dashboard">
        <div id="dashboardMessage" class="message" hidden></div>

        <section id="assignedWorkSection" class="work-panel">
            <div class="section-heading">
                <div>
                    <h2 id="workTableTitle">Today's Assigned Work</h2>
                    <p id="workTableSubtitle">
                        Work mapped to your employee master record
                    </p>
                </div>
                <button id="refreshBtn" class="refresh-btn" type="button">
                    Refresh
                </button>
            </div>

            <div class="table-wrap">
                <table data-mobile-layout="staff-work">
                    <thead>
                        <tr>
                            <th>S.No.</th>
                            <th>Date</th>
                            <th>Loco No.</th>
                            <th>Schedule</th>
                            <th>Assigned Work</th>
                            <th>Remarks</th>
                            <th>Assigned By</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="assignedWorkBody">
                        <tr>
                            <td colspan="9">Loading assigned work...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="../js/staff.js"></script>
    <script src="/js/pwa.js"></script>
</body>
</html>
