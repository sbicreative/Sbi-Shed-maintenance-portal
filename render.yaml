services:
  - type: web
    name: sbi-shed-maintenance-portal
    runtime: node
    plan: free
    region: singapore
    branch: codex/render-deploy
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: TRACKING_SUPABASE_URL
        sync: false
      - key: TRACKING_SUPABASE_ANON_KEY
        sync: false
